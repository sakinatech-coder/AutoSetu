<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoSetu - Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.signup-box{
    width:100%;
    max-width:480px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:160px;
    max-width:100%;
}

.logo-text{
    font-size:30px;
    font-weight:800;
    color:#243b64;
}

.logo-text span{
    color:#f59e0b;
}

h1{
    text-align:center;
    color:#243b64;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:22px;
}

.form-row{
    display:flex;
    gap:12px;
}

.form-group{
    flex:1;
}

label{
    display:block;
    margin:12px 0 7px;
    color:#243b64;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#f59e0b;
}

.signup-btn{
    width:100%;
    padding:13px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.signup-btn:hover{
    background:#d97706;
}

.message{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

.login{
    text-align:center;
    margin-top:18px;
    color:#666;
}

.login a{
    color:#f59e0b;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:13px;
    color:#243b64;
    text-decoration:none;
}

@media(max-width:500px){

    .form-row{
        flex-direction:column;
        gap:0;
    }

    .signup-box{
        padding:22px;
    }
}
</style>
</head>

<body>

<div class="signup-box">

    <!-- LOGO -->

    <div class="logo">

        <img
            src="images/autosetu.png"
            alt="AutoSetu Logo"
            onerror="this.style.display='none';document.getElementById('logoText').style.display='block';"
        >

        <div
            id="logoText"
            class="logo-text"
            style="display:none;">
            Auto<span>Setu</span>
        </div>

    </div>


    <h1>Create Account 👋</h1>

    <p class="subtitle">
        Join AutoSetu and start your journey.
    </p>


    <!-- SIGNUP FORM -->

    <form onsubmit="registerUser(event)">

        <div class="form-row">

            <div class="form-group">

                <label>First Name</label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="First name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Last Name</label>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                    required
                >

            </div>

        </div>


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >


        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Create Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            required
        >


        <label>Account Type</label>

        <select id="role" required>

            <option value="">
                Select account type
            </option>

            <option value="passenger">
                👤 Passenger
            </option>

            <option value="driver">
                🚕 Driver
            </option>

        </select>


        <button
            type="submit"
            class="signup-btn">

            Create Account

        </button>


        <p
            id="message"
            class="message">
        </p>

    </form>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a
        href="index.html"
        class="home">

        ← Back to Home

    </a>

</div>


<script>

function registerUser(event){

    event.preventDefault();


    const firstName =
        document.getElementById("firstName")
        .value.trim();

    const lastName =
        document.getElementById("lastName")
        .value.trim();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const role =
        document.getElementById("role")
        .value;


    const message =
        document.getElementById("message");


    if(phone.length !== 10){

        message.style.color = "red";

        message.innerText =
            "Please enter a valid 10-digit phone number.";

        return;
    }


    if(password.length < 6){

        message.style.color = "red";

        message.innerText =
            "Password must contain at least 6 characters.";

        return;
    }


    const user = {

        firstName:firstName,

        lastName:lastName,

        phone:phone,

        email:email,

        password:password,

        role:role

    };


    localStorage.setItem(
        "autosetuUser",
        JSON.stringify(user)
    );


    localStorage.setItem(
        "autosetuEmail",
        email
    );


    localStorage.setItem(
        "autosetuRole",
        role
    );


    message.style.color = "green";

    message.innerText =
        "✅ Account created successfully!";


    setTimeout(function(){

        if(role === "passenger"){

            window.location.href =
                "passenger.html";

        }
        else if(role === "driver"){

            window.location.href =
                "driver.html";

        }

    },1000);

}

</script>

</body>
</html>
