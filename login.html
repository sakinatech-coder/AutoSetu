<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoSetu - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:800;
    color:#243b64;
    margin-bottom:20px;
}

.logo span{
    color:#f59e0b;
}

h1{
    text-align:center;
    color:#243b64;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:22px;
}

label{
    display:block;
    margin:14px 0 7px;
    font-weight:bold;
    color:#243b64;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

input:focus,select:focus{
    border-color:#f59e0b;
}

.login-btn{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#d97706;
}

.message{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

.signup{
    text-align:center;
    margin-top:18px;
    color:#666;
}

.signup a{
    color:#f59e0b;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#243b64;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Auto<span>Setu</span>
    </div>

    <h1>Welcome Back 👋</h1>

    <p class="subtitle">
        Login to continue
    </p>

    <form onsubmit="loginUser(event)">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <label>Login As</label>

        <select id="role" required>

            <option value="">
                Select account type
            </option>

            <option value="passenger">
                👤 Passenger
            </option>

            <option value="driver">
                🚕 Driver
            </option>

            <option value="admin">
                ⚙️ Admin
            </option>

        </select>

        <button
            type="submit"
            class="login-btn">
            Login
        </button>

        <p id="message" class="message"></p>

    </form>

    <div class="signup">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>


<script>

function loginUser(event){

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const role =
        document.getElementById("role")
        .value;

    const message =
        document.getElementById("message");


    const savedUser =
        JSON.parse(
            localStorage.getItem("autosetuUser")
        );


    /*
       Demo Admin Login
       Email: admin@autosetu.com
       Password: admin123
    */

    if(
        role === "admin" &&
        email === "admin@autosetu.com" &&
        password === "admin123"
    ){

        localStorage.setItem(
            "autosetuEmail",
            email
        );

        localStorage.setItem(
            "autosetuRole",
            "admin"
        );

        window.location.href =
            "admin.html";

        return;
    }


    /* CHECK REGISTERED USER */

    if(!savedUser){

        message.style.color = "red";

        message.innerText =
            "No account found. Please sign up first.";

        return;
    }


    if(
        email !== savedUser.email ||
        password !== savedUser.password ||
        role !== savedUser.role
    ){

        message.style.color = "red";

        message.innerText =
            "Incorrect email, password or account type.";

        return;
    }


    localStorage.setItem(
        "autosetuEmail",
        email
    );

    localStorage.setItem(
        "autosetuRole",
        role
    );


    message.style.color = "green";

    message.innerText =
        "✅ Login successful!";


    setTimeout(function(){

        if(role === "passenger"){

            window.location.href =
                "passenger.html";

        }
        else if(role === "driver"){

            window.location.href =
                "driver.html";

        }

    },700);

}

</script>

</body>
</html>
